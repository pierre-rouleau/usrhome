name: Shell tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]

    steps:
      - uses: actions/checkout@v4

      - name: Install Zsh on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Run tests
        shell: bash
        run: |
          command -v bash
          command -v zsh
          ./test/run-tests

# ----------------------------------------------------------------------------
